# Canonical element list for ChemistryLab OS.
#
# v0.1 deliberately ships only symbol + atomic number + a name key: these are
# immutable IUPAC facts, not measurements, so there is no fabrication risk.
# Atomic mass, electronegativity, and other measured quantities are Phase 1
# work — see ROADMAP.md — and will carry their own provenance when added.
#
# This file is validated against @chemistrylab/chemspec's elementSchema by
# `pnpm validate:data`, and is the single source of truth codegen'd into
# packages/core/src/generated/elements.ts by `pnpm generate:elements`.
# Do not hand-edit the generated file.
- { symbol: H, atomicNumber: 1, nameKey: element.hydrogen.name }
- { symbol: He, atomicNumber: 2, nameKey: element.helium.name }
