# Canonical element list for ChemistryLab OS.
#
# symbol/atomicNumber/nameKey are immutable IUPAC facts, not measurements —
# no fabrication risk. atomicMass is the first Phase 1 (see ROADMAP.md)
# measured property: CIAAW's "Abridged Standard Atomic Weights 2024" table
# (organization CIAAW, https://www.ciaaw.org/abridged-atomic-weights.htm),
# fetched and parsed directly from the page's raw HTML on 2026-09-08, not
# summarized by an intermediate model — see DATA_SOURCES.md on why that
# distinction matters. `value` is CIAAW's abridged single value (quoted to
# 5 significant figures; trailing zeros are preserved as published, not
# rounded), `uncertainty` is CIAAW's own published +/- for that value.
#
# Not carried: CIAAW's per-element footnote letters (g/m/r), which flag
# e.g. that commercial material's isotopic composition may deviate from
# the natural range assumed here. See the CIAAW page directly if that
# matters for a given element. Every entry below is `unverified` (the
# schema default) — an AI agent authored this transcription, and per
# CHEMISTRY_GUIDELINES.md cannot also be the one who verifies it.
#
# This file is validated against @chemistrylab/chemspec's elementSchema by
# `pnpm validate:data`, and is the single source of truth codegen'd into
# packages/core/src/generated/elements.ts by `pnpm generate:elements`
# (which reads only symbol/atomicNumber — atomicMass/provenance never
# reach the generated, dependency-free @chemistrylab/core package).
# Do not hand-edit the generated file.
