name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint, typecheck, test, validate, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Check generated files are up to date
        run: |
          pnpm generate:elements
          pnpm generate:schemas
          git diff --exit-code -- packages/core/src/generated packages/chemspec/schemas || {
            echo "::error::Generated files are stale. Run 'pnpm generate:elements && pnpm generate:schemas' and commit the result.";
            exit 1;
          }

      - name: Validate chemistry datasets
        run: pnpm validate:data

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: playground e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright's Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: apps/web
        run: pnpm test:e2e
